name: Pytest

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (envoy Python 3.11)
    runs-on: ["self-hosted", "Linux", "X64", "debian-13", "ci"]
    defaults:
      run:
        shell: pwsh
    env:
      ENVOY_STACK: ""
      ENVOY_STACK_CONTEXT: ""
      ENVOY_BNDL_ROOTS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9 (envoy runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Checkout gt.globals source Bundle
        uses: actions/checkout@v4
        with:
          repository: gtvfx-envoy/globals
          path: .ci/globals

      - name: Bootstrap isolated Envoy runtime
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $release = "v0.6.2"
          $root = Join-Path $env:RUNNER_TEMP "validation-envoy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $archive_name = "envoy-$release-linux-x86_64-musl.tar.gz"
          $archive = Join-Path $root $archive_name
          $release_url = "https://github.com/gtvfx-envoy/envoy/releases/download/$release"
          Invoke-WebRequest "$release_url/$archive_name" -OutFile $archive
          $checksums = (Invoke-WebRequest "$release_url/SHA256SUMS").Content
          $pattern = "(?m)^([0-9a-fA-F]{64})\s+\*?$([Regex]::Escape($archive_name))\r?$"
          $checksum = [Regex]::Match($checksums, $pattern)
          if (-not $checksum.Success) {
            throw "Missing checksum for $archive_name"
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $checksum.Groups[1].Value) {
            throw "Checksum mismatch for $archive_name"
          }
          tar -xzf $archive -C $root

          $bin = Join-Path $root "gt\envoy\$release\bin"
          $envoy = Join-Path $bin "envoy"
          $site_packages = Join-Path $root "site-packages"
          $commands_file = Join-Path $root "commands.json"
          $commands = Get-Content .envoy\commands.json -Raw | ConvertFrom-Json -AsHashtable
          $commands.python = @{
            alias = @((Get-Command python).Source)
            environment = @("python_env.json")
          }
          $commands.validate.environment = @("python_env.json")
          $commands | ConvertTo-Json -Depth 10 | Set-Content $commands_file -Encoding utf8NoBOM
          @{
            environment = @{
              PYTHONNOUSERSITE = "1"
              PYTHONPATH = @(
                (Resolve-Path py).Path
                (Resolve-Path .ci\globals\py).Path
                $site_packages
              ) -join [IO.Path]::PathSeparator
              PATH = "$bin$([IO.Path]::PathSeparator)$env:PATH"
            }
          } | ConvertTo-Json -Depth 10 |
            Set-Content (Join-Path $root "python_env.json") -Encoding utf8NoBOM
          "ENVOY_COMMANDS_FILE=$commands_file" | Add-Content $env:GITHUB_ENV
          $bin | Add-Content $env:GITHUB_PATH
          & $envoy --ignore-config --inherit-env --commands-file $commands_file python -m pip install --target $site_packages '.[dev]'
          & $envoy --ignore-config --inherit-env --commands-file $commands_file python -c "import gt.runtime, gt.validator, pytest; print(gt.runtime.__file__); print(gt.validator.__file__)"

      - name: Run pytest via envoy Python
        run: |
          envoy --ignore-config --inherit-env --commands-file $env:ENVOY_COMMANDS_FILE python -m pytest py -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.sha }}
          include-hidden-files: true
          path: |
            **/.pytest_cache/v/cache/lastfailed
            **/.pytest_cache/v/cache/nodeids
